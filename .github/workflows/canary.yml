name: conformance canary

# The server lanes against the runner's alpha dist-tag, to see what a newer
# runner would change before the pin moves. Differences from the baselines
# show in the job log and artifacts; the canary gates nothing.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server ${{ matrix.revision }} against the alpha runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        revision: ["2026-07-28", "2025-11-25", "2025-06-18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the alpha runner
        run: |
          mkdir -p "$RUNNER_TEMP/runner"
          npm install --prefix "$RUNNER_TEMP/runner" --ignore-scripts @modelcontextprotocol/conformance@alpha
          echo "PRESA_CONFORMANCE_RUNNER=$RUNNER_TEMP/runner/node_modules/@modelcontextprotocol/conformance/dist/index.js" >> "$GITHUB_ENV"
          echo "PRESA_CONFORMANCE_UNPINNED=1" >> "$GITHUB_ENV"
      - name: Run the lane against its baseline
        run: bb conformance ${{ matrix.revision }}
      - name: Keep the runner's raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-server-${{ matrix.revision }}
          path: tmp/conformance/${{ matrix.revision }}/
          if-no-files-found: warn
